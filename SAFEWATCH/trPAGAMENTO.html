<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <script src="pagamento.js"></script>
    <link rel="stylesheet" href="style1.css">
</head>
<body>


    <button class="method" id="pixscript"   onclick="trocarformaPIX()">PIX</button>
    <button class="method" id="cartaoscript"  onclick="trocarformaCARTAO()">CARTÃO</button>
    <button class="method" id="boletoscript"  onclick="trocarformaBOLETO()">BOLETO</button>


    <section id="tela-pix" style="display: block;"> 


        
    <div class="pix-area"> 
    <div class="pix-info"> 

    <p>Pague com PIX</p> 
    <small>Escaneie o QR Code ou copie o código abaixo</small> 
    <input type="text" value="00020126580014BR.GOV.BCB.PIX..." readonly> 
    </div> 

    <div class="qr-placeholder"> 
    <div class="qr-box">
    <img src="https://www.image2url.com/r2/default/images/1777925675986-4183cac5-950d-4ace-869a-589c52015e62.png" alt="image" width="80px" />
    </div> 
    </div> 
    </div> 

    <div> 
        <a href="index.html"><button class="botao-pagamento" onclick="Finalizar()">Finalizar compra</button></a> 
    </div> 

    </section> 

    
    <section id="tela-cartao" style="display: none;"> 
    <div class="card-area"> 
        <div class="field"> 
    <label>Número do cartão</label> 
    <div class="input-with-icons"> 
    <input type="text" placeholder="0000 0000 0000 0000"> 
    <div class="card-logos"> 
        <img src="https://www.image2url.com/r2/default/images/1777933852995-66953222-d9aa-498a-885b-678e2729913b.png" alt="Visa" width="35px" height="18px"> 
        <img src="https://www.image2url.com/r2/default/images/1777933923422-b4e08ba3-aad7-4e9d-9ff9-8d3c296b3631.png" alt="Master" width="35px" height="20px"> 
        <img src="https://www.image2url.com/r2/default/images/1777933967526-4f3ad794-88ad-43ef-8943-112a62836904.png" alt="image" width="35px" height="25px"/> 
        <img src="https://www.image2url.com/r2/default/images/1777933987231-26a29fd4-2f4b-4ae6-808d-2d9be6be06ee.png" alt="image" width="35px" height="25px"/> 
    </div> 
    </div> 
    </div> 
        
    <div class="grid-row mt-15"> 
    <div class="nome-pagamento flex-2"> 
    <label>Nome no cartão</label> 
    <input type="text" placeholder="Como está no cartão"> 
    </div> 
    <div class="nome-pagamento"> 
    <label>Validade</label> 
    <input type="text" placeholder="MM/AA"> 
    </div> 
    <div class="nome-pagamento"> 
    <label>CVV</label> 
    <div class="input-help"> 
    <input type="text" placeholder="123"> 
    <span class="help-icon">?</span> 

    </div> 
    </div> 
        </div> 
        
        <div class="nome-pagamento mt-15"> 
        <label>Parcelamento</label> 
        <select> 
    <option>Selecione o número de parcelas</option> 
    <option>1x de R$ 100,00 sem juros</option> 
    <option>2x de R$ 50,00 sem juros</option> 
        </select> 
        </div> 
    </div> 
    
    <div> 
    <div id="pagar-cartao"> 
    <a href="index.html"><button class="botao-pagamento" onclick="Finalizar()">Finalizar compra</button></a> 
        </div> 
    </div> 
    </section> 



        <section id="tela-boleto" style="display: none;"> 
    <div class="boleto-area"> 
    <div class="boleto-info"> 
    <div class="boleto-texto"> 
    <p>O boleto será gerado após a finalização do pedido.</p> 
    </div> 
    <ul> 
    <li>Vencimento em 3 dias úteis.</li> 
    <li>Aprovação em até 48 horas.</li> 
    </ul> 
    </div> 
    </div> 
    <div> 
    <div id="pagar-boleto"> 
        <a href="index.html"><button class="botao-pagamento" onclick="Finalizar()">Finalizar compra</button></a> 
        </div> 
    </div> 
    </section>

        
    </body>
    </html>
